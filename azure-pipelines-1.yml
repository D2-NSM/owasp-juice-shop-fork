trigger:
- docker-juice-shop 

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Docker@2
    displayName: Build a Docker Image
    inputs:
      command: build
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      repository: d2dockerd2/juice-shop-wiz
      tags: |
        testPush

# For IaC scanning of files & folders (Dockerfiles, Terraform, etc.) -
  - task: wiz@0
    displayName: Wiz CLI Scan
    inputs:
      command: 'iac'
      clientid: $(WIZ_CLIENT_ID)
      secret: $(WIZ_CLIENT_SECRET) 
      policyHitsOnly: true
      succeedOnFailures: false
      debug: true
      scanPolicies: 'Test IaC Policy'
      scanTags: 'app=DockerfileForkedOWASPjuiceshop'
      path: '.'
      name: 'Dockerfile'
      scanSecrets: true

