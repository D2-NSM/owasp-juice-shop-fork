trigger:
- docker-juice-shop  # Changed from master to docker-juice-shop

steps:
  - task: Docker@2
    displayName: Build an image
    inputs:
      repository: owasp-juice-shop-fork
      command: build
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
  
  - task: DockerInstaller@0
    inputs:
      dockerVersion: '17.09.0-ce'
  
  - script: docker pull d2dockerd2/juice-shop-wiz:latest
    displayName: 'Pull Docker Image'

  - task: wiz@0
    displayName: Wiz Image Tag
    inputs:
     command: 'tag'
     clientid: $(WIZ_CLIENT_ID)
     secret: $(WIZ_CLIENT_SECRET)
     image: 'd2dockerd2/juice-shop-wiz:latest'
    
  - task: wiz@0  
    displayName: Wiz CLI Scan Docker Image
    inputs:  
      command: 'image'  
      clientid: $(WIZ_CLIENT_ID)
      secret: $(WIZ_CLIENT_SECRET)
      succeedOnFailures: false  
      policyHitsOnly: true
      image: 'juice-shop-wiz:latest'
      scanPolicies: 'vuln-one-critical, vuln-two-high'  