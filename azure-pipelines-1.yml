# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- docker-juice-shop  # Changed from master to docker-juice-shop

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(tag)

    # Add Wiz CLI scan after the Docker image is built
    - task: wiz@0  
      displayName: Wiz CLI Scan Docker Image
      inputs:  
        command: 'image'  
        clientid: $(WIZ_CLIENT_ID)  # Ensure these environment variables are set in your pipeline
        secret: $(WIZ_CLIENT_SECRET)
        succeedOnFailures: false  
        policyHitsOnly: true  
        scanTags: 'cicd=ado,build=$(Build.BuildId),juice-shop'  # Adjusted the scanTags to match your context
        image: '$(Build.Repository.Name):$(tag)'  # Scanning the image just built in the pipeline
        scanPolicies: 'vuln-one-critical, vuln-two-high'  
        scanSecrets: false  
        driver: 'mountWithLayers'  
        sudo: true
