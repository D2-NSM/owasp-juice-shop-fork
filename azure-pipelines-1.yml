trigger:
- docker-juice-shop 

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Docker@2
    displayName: Build a Docker Image
    inputs:
      command: build
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      tags: |
          d2dockerd2/juice-shop-wiz:testPush
  - task: Docker@2
    displayName: Push Docker Image to DockerHub
    inputs:
      command: push
      repository: d2dockerd2/juice-shop-wiz
      tags: |
          testPush
      
  - script: docker pull d2dockerd2/juice-shop-wiz:latest
    displayName: Pull Docker Image
  - task: wiz@0
    displayName: Wiz CLI Scan
    inputs:
      command: 'image'
      clientid: $(WIZ_CLIENT_ID)
      secret: $(WIZ_CLIENT_SECRET) 
      image: 'd2dockerd2/juice-shop-wiz:latest'
      policyHitsOnly: true
      succeedOnFailures: true
      scanTags: 'app=forkedOWASPjuiceshop'