trigger:
- docker-juice-shop

resources:
- repo: self

variables:
  imageRepository: 'd2dockerd2/juice-shop-wiz'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and Scan Docker Image
  jobs:
  - job: Build
    displayName: Build Docker Image
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(imageRepository):$(tag)

    - task: Docker@2
      displayName: Push Docker Image to DockerHub
      inputs:
        command: push
        repository: $(imageRepository)
        tags: |
          $(tag)

    - task: wiz@0  
      displayName: Scan Docker Image with Wiz CLI
      inputs:  
        command: 'image'  
        clientid: $(WIZ_CLIENT_ID)  
        secret: $(WIZ_CLIENT_SECRET)  
        succeedOnFailures: false  
        policyHitsOnly: true  
        scanTags: 'cicd=ado,build=$(Build.BuildId)'  
        image: '$(imageRepository):$(tag)'  
        scanPolicies: 'vuln-one-critical, vuln-two-high'  
        scanSecrets: false  
        driver: 'mountWithLayers'  
        sudo: true 
