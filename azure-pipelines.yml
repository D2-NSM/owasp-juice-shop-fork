trigger:
  - main
  - ist-azure-pipelines

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Docker@2
    displayName: Build Docker Image
    inputs:
      command: build
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      repository: <YOUR_DOCKERHUB_USER>/juice-shop-wiz
      tags: |
        latest

  - task: wiz@1
    displayName: Wiz CLI - Container Image Scan
    inputs:
      serviceConnectionId: '<YOUR_SERVICE_CONNECTION_NAME>'
      command: 'scan'
      scanType: 'containerimage'
      image: '<YOUR_DOCKERHUB_USER>/juice-shop-wiz:latest'
      driver: 'mount'
      sudo: true
      succeedOnFailures: true

  - task: Docker@2
    displayName: Push to Docker Hub
    inputs:
      containerRegistry: '<YOUR_DOCKERHUB_SERVICE_CONNECTION>'
      command: push
      repository: <YOUR_DOCKERHUB_USER>/juice-shop-wiz
      tags: |
        latest

  - task: wiz@1
    displayName: Wiz CLI - Image Tag
    inputs:
      serviceConnectionId: '<YOUR_SERVICE_CONNECTION_NAME>'
      command: 'tag'
      image: '<YOUR_DOCKERHUB_USER>/juice-shop-wiz:latest'
      driver: 'mount'
      sudo: true